<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
    <title id="title">AION proposed White Box service boundary</title><desc id="desc">Public-safe logical module map, not a performance or deployed service guarantee.</desc>
    <defs><marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0 8 3.5 0 7" fill="#62deeb"/></marker></defs>
    <rect width="1120" height="500" rx="16" fill="#081322"/>
    <rect x="40" y="60" width="275" height="86" rx="12" fill="#102d40" stroke="#5e9cb2"/><text x="177.5" y="91" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">Permitted data feed</text><text x="177.5" y="115" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">Customer-controlled rights</text><path d="M315 103 L360 103" fill="none" stroke="#62deeb" stroke-width="3" marker-end="url(#arr)"/><rect x="370" y="60" width="310" height="86" rx="12" fill="#174457" stroke="#5e9cb2"/><text x="525.0" y="91" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">Rust Greeks / indicators</text><text x="525.0" y="115" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">Versioned derived outputs</text><path d="M680 103 L725 103" fill="none" stroke="#62deeb" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="60" width="340" height="86" rx="12" fill="#102d40" stroke="#5e9cb2"/><text x="905.0" y="91" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">WSS /v1/stream/greeks</text><text x="905.0" y="115" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">Dedicated processed feature stream</text><path d="M900 146 L900 205" fill="none" stroke="#62deeb" stroke-width="3" marker-end="url(#arr)"/><rect x="735" y="210" width="340" height="88" rx="12" fill="#174457" stroke="#5e9cb2"/><text x="905.0" y="241" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">Customer-owned detector</text><text x="905.0" y="265" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">Strategy logic stays with client</text><path d="M735 254 L680 254" fill="none" stroke="#62deeb" stroke-width="3" marker-end="url(#arr)"/><rect x="370" y="210" width="300" height="88" rx="12" fill="#102d40" stroke="#5e9cb2"/><text x="520.0" y="241" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">REST /v1/edge/evaluate</text><text x="520.0" y="265" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">Optional candidate metadata only</text><path d="M370 254 L315 254" fill="none" stroke="#62deeb" stroke-width="3" marker-end="url(#arr)"/><rect x="40" y="210" width="275" height="88" rx="12" fill="#102d40" stroke="#5e9cb2"/><text x="177.5" y="241" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">Heuristics + native ML</text><text x="177.5" y="265" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">PASS / FAIL / UNAVAILABLE</text><rect x="40" y="357" width="1035" height="75" rx="12" fill="#102d40" stroke="#5e9cb2"/><text x="557.5" y="388" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#e8f8ff">Security boundary</text><text x="557.5" y="412" font-family="system-ui,Arial,sans-serif" text-anchor="middle" font-size="13" fill="#bad3df">No client strategy code required · Disclosed metadata is contract-limited</text>
    <text x="560" y="482" font-family="system-ui,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#b5ceda">Conceptual target only · Licensed inputs · No raw-tick redistribution · No broker orders</text>
    </svg>